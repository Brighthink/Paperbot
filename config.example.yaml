# paperbot example config. Copy it to config.yaml and fill in your values (config.yaml is gitignored).
# paperbot 설정 예시 — config.yaml로 복사해 값을 채운다 (config.yaml은 gitignore).
#   cp config.example.yaml config.yaml

topics:
  # 주제 설명은 관련성 필터, query는 각 검색 API에 사용됩니다.
  - name: "ship-performance-prediction"
    platform: "markdown"
    interest: >
      Ship performance prediction from hull geometry and hull-form design parameters, with a focus on
      surrogate models, uncertainty quantification, and prediction-error decomposition. Include ship
      hydrodynamic performance, resistance, and powering when the work connects them to hull-form
      prediction. Exclude unrelated ship operations and generic surrogate-model applications without
      a ship or hull-form performance context.
    sources:
      semantic_scholar:
        query: >
          (ship | hull) + ("ship performance" | "performance prediction" | "hull form" |
          "ship resistance" | "hydrodynamic performance" | "surrogate model" |
          "surrogate modeling" | "surrogate modelling" | "uncertainty quantification" |
          "error decomposition")
        sort: "recency"
      arxiv:
        enabled: true
        query: >
          (cat:physics.flu-dyn OR cat:physics.comp-ph OR cat:cs.CE OR cat:cs.LG OR cat:eess.SY) AND
          (all:ship OR all:hull) AND
          (all:"performance prediction" OR all:"ship performance" OR all:"hull form" OR
          all:"ship resistance" OR all:"hydrodynamic performance" OR all:"surrogate model" OR
          all:"uncertainty quantification" OR all:"error decomposition")

  - name: "surrogate-based-design-optimization"
    platform: "markdown"
    interest: >
      Sampling methods for building and updating surrogate models used in engineering design
      optimization, including surrogate-based design optimization (SBDO). Focus on design of
      experiments, space-filling designs such as Latin hypercube and Sobol sequences, and active or
      adaptive sampling. Compare sample efficiency, surrogate accuracy, and optimization performance.
      Exclude sampling studies unrelated to surrogate models and design optimization.
    sources:
      semantic_scholar:
        query: >
          ("sampling method" | "sampling strategy" | "design of experiments" | "Latin hypercube" |
          "Sobol sequence" | "space filling" | "active learning" | "adaptive sampling") +
          ("surrogate model" | "surrogate modeling" | "surrogate modelling" | metamodel) +
          ("design optimization" | "surrogate based optimization" |
          "surrogate based design optimization" | SBDO)
        sort: "recency"
      arxiv:
        enabled: true
        query: >
          (cat:cs.CE OR cat:math.OC OR cat:cs.LG OR cat:eess.SY) AND
          (all:"sampling method" OR all:"sampling strategy" OR all:"design of experiments" OR
          all:"Latin hypercube" OR all:"Sobol sequence" OR all:"space filling" OR
          all:"active learning" OR all:"adaptive sampling") AND
          (all:"surrogate model" OR all:metamodel) AND
          (all:"design optimization" OR all:"surrogate based optimization" OR
          all:"surrogate based design optimization" OR all:SBDO)

fetch:
  max_results_per_query: 10   # candidates per source per topic / 소스별 검색 후보 수
  arxiv_lookback_days: 14     # only arXiv submissions from the last N days / 최근 N일 제출분만
  s2_lookback_days: 0         # no age cutoff; S2 still sorts newest first / 날짜 제한 없음, S2는 최신순 정렬
  s2_max_pages_per_run: 3     # citation-sorted topics only: bulk pages (1000 each) to scan per run / 인용순 topic 전용
  unpaywall_email: ""         # your email for Unpaywall OA lookup when a publisher blocks the PDF (empty = off) / Unpaywall 조회용 이메일 (비우면 미사용)

quota:
  # Per-run cap per topic and source. 0 = unlimited. Extra papers wait in the pending queue (FIFO).
  # 실행 1회당 topic×소스별 처리 상한. 0 = 무제한. 초과분은 pending 대기열(FIFO)에 둔다.
  s2_per_topic: 3
  arxiv_per_topic: 2
  pending_max_age_days: 30    # drop pending papers older than this; 0 = never / 이보다 오래 대기한 pending 폐기, 0 = 무제한

filter:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_device: "cpu"     # keep filtering on CPU / 필터는 CPU에서 실행
  embedding_threshold: 0.25   # cosine(interest, title+abstract) floor / cosine 하한
  llm_judge: true             # re-score survivors with the LLM (0-10) / 임베딩 통과분을 LLM으로 재채점
  judge_threshold: 6          # 0-10 / 점수 하한

llm:
  base_url: "https://api.openai.com/v1"  # OpenAI API; local llama-swap is also supported / OpenAI API (로컬 llama-swap도 지원)
  model: "gpt-6-luna"
  num_ctx: 32768              # used only by an optional local endpoint; hosted API uses max_input_chars / 선택적 로컬 서버용, API는 max_input_chars 적용
  max_input_chars: 150000     # paper text sent to the model / 모델에 보낼 본문 상한
  max_output_tokens: 8192     # summary length cap / 요약 출력 상한
  temperature: 0.3
  language: "ko"              # summary language / 요약 언어

markdown:
  max_figures: 3              # save up to this many detected figure crops / 감지한 그림을 논문당 최대 저장
  max_tables: 3               # save up to this many detected table crops / 감지한 표를 논문당 최대 저장

gmail:
  enabled: false              # true면 요약한 논문마다 Gmail로 발송 / send one email per summarized paper
  to: ""                      # recipient email address / 수신 주소
  credentials_file: "~/.config/paperbot/gmail_credentials.json" # OAuth Desktop client JSON
  token_file: "~/.config/paperbot/gmail_token.json"             # locally authorized token; keep private
  subject_prefix: "[Paperbot]"

storage:
  db_path: "./data/papers.db" # sqlite search history / 검색 이력 DB
  pdf_dir: "./data/pdfs"      # temporary PDF files / PDF 임시 저장
  markdown_dir: "./data/markdown" # per-paper folders with summary and images / 요약·이미지 논문별 폴더
  keep_pdfs: false            # delete PDFs after summarizing / 요약 후 PDF 삭제
